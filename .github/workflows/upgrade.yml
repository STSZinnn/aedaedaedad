        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          packed = base64.b64decode(os.environ['PATCH_B64'])
          assert hashlib.sha256(packed).hexdigest() == 'fbb170fcffe2ea15a621a1ca476fe34114339333e78951ada6d9100164626662', 'Upgrade checksum mismatch'
          changes = json.loads(lzma.decompress(packed))
          root = Path('aster-client')
          ready = {}
          for relative, change in changes.items():
              path = Path(relative)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit('Invalid upgrade path')
              path = root / path
              before = path.read_text(encoding='utf-8') if path.exists() else ''
              assert hashlib.sha256(before.encode()).hexdigest() == change['base'], 'Source version mismatch: ' + relative
              lines = before.splitlines(keepends=True)
              ready[path] = ''.join(part if isinstance(part, str) else ''.join(lines[part[0]:part[1]]) for part in change['parts'])
          for path, text in ready.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          PYTHON

      - name: Generate Gradle wrapper
        working-directory: aster-client
        run: gradle --no-daemon wrapper --gradle-version 9.2.1 --distribution-type bin

      - name: Upload updated source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: aster-client-1.1-source
          include-hidden-files: true
          if-no-files-found: error
          path: |
            aster-client/src/
            aster-client/gradle/
            aster-client/.github/
            aster-client/.gitignore
            aster-client/*.gradle
            aster-client/gradle.properties
            aster-client/gradlew
            aster-client/gradlew.bat
            aster-client/README.md
            aster-client/LICENSE

      - name: Build and check
        working-directory: aster-client
        run: bash ./gradlew --no-daemon build

      - name: Upload updated mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: aster-client-1.1-mc1.21.11
          if-no-files-found: error
          path: |
            aster-client/build/libs/aster-client-1.1.0.jar
