name: Build Aster Client 1.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Restore source from your original working workflow
        run: |
          python3 - <<'PYTHON'
          import base64, json, lzma, re
          from pathlib import Path
          source = None
          for file in Path('.github/workflows').iterdir():
              if file.suffix not in ('.yml', '.yaml'):
                  continue
              for match in re.finditer(r'packed\s*=\s*base64\.b64decode\(\s*"""(.*?)"""', file.read_text(), re.S):
                  try:
                      candidate = json.loads(lzma.decompress(base64.b64decode(match.group(1))))
                      if 'mod_version=1.0.0' in candidate.get('gradle.properties', ''):
                          source = candidate
                          break
                  except (ValueError, lzma.LZMAError):
                      continue
              if source is not None:
                  break
          if source is None:
              raise SystemExit('Keep the original working build.yml and create this upgrade as a separate upgrade.yml file.')
          root = Path('aster-client')
          for relative, text in source.items():
              path = Path(relative)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit('Invalid source path')
              path = root / path
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          PYTHON

