      - name: Generate the Gradle wrapper
        working-directory: aster-client
        run: gradle --no-daemon wrapper --gradle-version 9.2.1 --distribution-type bin

      - name: Upload the full source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: aster-client-source
          include-hidden-files: true
          if-no-files-found: error
          path: |
            aster-client/src/
            aster-client/gradle/
            aster-client/.github/
            aster-client/.gitignore
            aster-client/*.gradle
            aster-client/gradle.properties
            aster-client/gradlew
            aster-client/gradlew.bat
            aster-client/README.md
            aster-client/LICENSE

      - name: Build and check
        working-directory: aster-client
        run: bash ./gradlew --no-daemon build

      - name: Upload the mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: aster-client-mc1.21.11
          path: |
            aster-client/build/libs/*.jar
            !aster-client/build/libs/*-sources.jar
          if-no-files-found: error
